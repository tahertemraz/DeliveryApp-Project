<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliveroo — Login</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <main>
      <h1 style="margin-bottom: 1.5rem; font-size: 1.4rem; color: #111;">Login to your account</h1>
      <form method="POST" action="/auth/login">
        <label>
          Email Address:
          <input
            placeholder="you@example.com"
            type="email"
            name="userEmail" 
            required
          />
        </label>
        <label>
          Password:
          <input
            placeholder="Password"
            type="password"
            name="password"
            required
          />
        </label>
        <button type="submit">Log In</button>
      </form>
      <p style="margin-top: 1rem; font-size: 0.9rem; color: #777; text-align: center;">
        Don't have an account? <a href="/auth/register" style="color: #00ccbc;">Register</a>
      </p>
    </main>
  </body>
</html>
